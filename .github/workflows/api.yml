name: api

# Pull requests always run (no path filter): the checks below are required on main, and a required
# check that never starts would block a PR that only touches docs.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-lint:
    name: Contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
        working-directory: contract
      - name: Validate OpenAPI (Spectral, warnings fail)
        run: npm run lint:contract
        working-directory: contract

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # validate (checkstyle) -> compile -> unit tests -> package -> integration tests on real Postgres (Testcontainers).
      - name: mvn verify
        run: mvn -B -ntp verify
      # The same jar the contract tests start below, so they test exactly what was built and tested here.
      - name: Keep the built service for the contract tests
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 1
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7

  migrations:
    name: Migrations
    # Brief: "Versioned migrations that run automatically in the pipeline and can be reversed." On every pull request
    # and push: apply every migration to an empty PostgreSQL 18, roll every one back to the empty baseline, and apply
    # them again. A changeset whose rollback is missing or wrong fails here, before it can reach the live database.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bloodlink
          POSTGRES_USER: bloodlink
          POSTGRES_PASSWORD: bloodlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bloodlink" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB: >-
        -Dliquibase.url=jdbc:postgresql://localhost:5432/bloodlink -Dliquibase.username=bloodlink
        -Dliquibase.password=bloodlink -Dliquibase.contexts=demo
      PGPASSWORD: bloodlink
      LIQUIBASE_ANALYTICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply every migration to an empty database
        run: mvn -B -ntp liquibase:update $DB
      - name: Roll every migration back to the empty baseline
        run: |
          mvn -B -ntp liquibase:rollback -Dliquibase.rollbackTag=v0-baseline $DB
          left=$(psql -h localhost -U bloodlink -d bloodlink -tAc "SELECT count(*) FROM information_schema.tables
                   WHERE table_schema = 'public' AND table_name NOT LIKE 'databasechangelog%'")
          echo "Tables and views left after rolling back: $left"
          if [ "$left" != "0" ]; then echo "::error::A rollback left $left tables or views behind"; exit 1; fi
      - name: Apply them again
        run: mvn -B -ntp liquibase:update $DB

  contract-test:
    name: Contract tests
    needs: build-and-test
    # Each account's run is time-boxed in the script; this is the hard stop if the service itself hangs.
    timeout-minutes: 20
    # Brief: "Contract tests in the pipeline confirming that the deployed service still satisfies the same document.
    # A divergence fails the build on the commit that caused it." The new build runs here against a throwaway
    # PostgreSQL with the demo data, and Schemathesis checks every answer against contract/openapi.yaml as each role.
    # A divergence blocks the deploy below.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bloodlink
          POSTGRES_USER: bloodlink
          POSTGRES_PASSWORD: bloodlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bloodlink" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install schemathesis==4.32.5
      - uses: actions/download-artifact@v7
        with:
          name: app-jar
      - name: Start the service
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/bloodlink
          DATABASE_USERNAME: bloodlink
          DATABASE_PASSWORD: bloodlink
          JWT_SECRET: contract-tests-only-secret-not-used-anywhere-else-0000
        run: |
          nohup java -jar app.jar > service.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then echo "Up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat service.log; exit 1
      - name: Every role, against the new build
        run: >-
          bash scripts/contract-test.sh http://localhost:8080 200
          admin@bloodlink.demo staff@lagos-central.bank.demo staff@yaba.hospital.demo donor@bloodlink.demo
      - name: Keep the report and service log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-test-report
          path: |
            contract-test-report
            service.log
          retention-days: 7

  deploy:
    name: Deploy
    needs: [contract-lint, build-and-test, migrations, contract-test]
    # Only main, only after every check above is green.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      DEPLOY_HOOK: ${{ secrets.API_DEPLOY_HOOK }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The live database is migrated here, before the new version starts, so the service no longer migrates itself
      # (host setting LIQUIBASE_ENABLED=false). Migrations are written to work with the version still running, because
      # the old version keeps serving until the new one is healthy.
      - name: Migrate the live database
        env:
          DB_URL: ${{ secrets.PROD_DATABASE_URL }}
          DB_USERNAME: ${{ secrets.PROD_DATABASE_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DATABASE_PASSWORD }}
          CONTEXTS: ${{ vars.LIQUIBASE_CONTEXTS || 'demo' }}
          LIQUIBASE_ANALYTICS_ENABLED: 'false'
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::PROD_DATABASE_URL secret not set yet; the service migrates the database itself when it starts."
            exit 0
          fi
          mvn -B -ntp liquibase:update -Dliquibase.url="$DB_URL" -Dliquibase.username="$DB_USERNAME" \
            -Dliquibase.password="$DB_PASSWORD" -Dliquibase.contexts="$CONTEXTS"
      - name: Trigger deploy on the host
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::API_DEPLOY_HOOK secret not set yet; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
      - name: Wait for the live service to run this commit
        if: env.DEPLOY_HOOK != '' && env.API_URL != ''
        env:
          COMMIT: ${{ github.sha }}
        run: |
          # Healthy is not enough: the host keeps the old version up until the new one passes its health check. Wait
          # until /actuator/info reports this commit, so the checks below test the new version. Free hosts build the
          # image and may be waking from sleep: allow up to 15 minutes.
          for i in $(seq 1 90); do
            running=$(curl -fsS "$API_URL/actuator/info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' || true)
            if [ "$running" = "$COMMIT" ]; then echo "Running $COMMIT after $((i * 10))s"; exit 0; fi
            echo "Live service is on ${running:-unknown}; waiting for $COMMIT"
            sleep 10
          done
          echo "::error::The live service did not switch to $COMMIT within 15 minutes"; exit 1

  deployed-contract-test:
    name: Contract tests on the deployed service
    needs: deploy
    # The live service against the same document. Administrator only, so these generated requests create no data.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install schemathesis==4.32.5
      - name: Administrator, against the live service
        # No random fuzzing here: Render's firewall blocks attack-like requests before they reach the service. The
        # build in CI is fuzzed as every role with nothing in front of it.
        env:
          CONTRACT_TEST_PHASES: examples,coverage
        run: bash scripts/contract-test.sh "${{ vars.API_URL }}" 5 admin@bloodlink.demo
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-contract-test-report
          path: contract-test-report
          retention-days: 7

  deployed-rule-check:
    name: Rule check on the deployed service
    needs: deploy
    # Brief: the concurrency test runs against the deployed service. Three approvals for the last unit, sent together.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Three hospitals, one unit, exactly one reservation
        run: node scripts/race-deployed.mjs "${{ vars.API_URL }}"
