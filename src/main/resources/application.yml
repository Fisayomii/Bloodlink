spring:
  application:
    name: bloodlink-api
  threads:
    virtual:
      enabled: true
  datasource:
    # JDBC form, e.g. jdbc:postgresql://host:5432/db?sslmode=require (not postgres://...).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bloodlink}
    username: ${DATABASE_USERNAME:bloodlink}
    password: ${DATABASE_PASSWORD:bloodlink}
    hikari:
      # Free Postgres tiers allow few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # On for v0 so a fresh deploy migrates itself. From Fri the pipeline runs migrations before the deploy
    # and the host sets LIQUIBASE_ENABLED=false.
    enabled: ${LIQUIBASE_ENABLED:true}
    # "demo" loads the demonstration organisations and accounts (002-demo-accounts.sql). Set LIQUIBASE_CONTEXTS=none
    # to deploy without them (an empty value would run every changeset, demo included).
    contexts: ${LIQUIBASE_CONTEXTS:demo}
  jackson:
    deserialization:
      # Refuse request bodies with fields the contract does not list (for example a patient name).
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

app:
  jwt:
    # HMAC-SHA256 signing key, at least 32 characters. On the host set JWT_SECRET to a long random value.
    # The default is for local development only; the service logs a warning when it is used.
    secret: ${JWT_SECRET:local-development-only-secret-do-not-deploy-0000}
    # How long a sign-in lasts. The contract says 8 hours.
    time-to-live: ${JWT_TTL:8h}
  cors:
    # Comma-separated. On the host: ALLOWED_ORIGINS=https://<your-site>.netlify.app
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  pattern:
    # Adds the request id to every log line, e.g. "INFO [swagger-1f2e...]". Locally this stays readable text.
    # On the host set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for one JSON object per line (request id included).
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
