spring:
  application:
    name: bloodlink-api
  threads:
    virtual:
      enabled: true
  datasource:
    # JDBC form, e.g. jdbc:postgresql://host:5432/db?sslmode=require (not postgres://...).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bloodlink}
    username: ${DATABASE_USERNAME:bloodlink}
    password: ${DATABASE_PASSWORD:bloodlink}
    hikari:
      # Free Postgres tiers allow few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Dates in the database ("today", expiry dates) follow Lagos time. Stored times (timestamptz) are unaffected.
      # This is a per-connection setting, so use the database's DIRECT connection, not a transaction pooler.
      connection-init-sql: SET TIME ZONE 'Africa/Lagos'
      # Neon suspends an idle database after 5 minutes; the first connection after that can take a second or two.
      connection-timeout: 30000
      # Close connections before a serverless database drops them on its side. No keepalive on purpose: pinging idle
      # connections would stop Neon from ever suspending and use up its free compute hours.
      max-lifetime: 600000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # On for v0 so a fresh deploy migrates itself. From Fri the pipeline runs migrations before the deploy
    # and the host sets LIQUIBASE_ENABLED=false.
    enabled: ${LIQUIBASE_ENABLED:true}
    # "demo" loads the demonstration organisations and accounts (002-demo-accounts.sql). Set LIQUIBASE_CONTEXTS=none
    # to deploy without them (an empty value would run every changeset, demo included).
    contexts: ${LIQUIBASE_CONTEXTS:demo}
  servlet:
    multipart:
      # No uploads anywhere in the contract. Off, so a multipart Content-Type is never parsed (a malformed one was a 500).
      enabled: false
  jackson:
    deserialization:
      # Refuse request bodies with fields the contract does not list (for example a patient name).
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Gzip JSON responses over 1 KB: lists of units and requests shrink several times over a slow mobile connection.
  compression:
    enabled: true
    mime-types: application/json,application/yaml,text/html,text/css,application/javascript
    min-response-size: 1KB
  error:
    include-stacktrace: never

app:
  # Business dates (is a unit expired today?) are Lagos dates.
  time-zone: Africa/Lagos
  jwt:
    # HMAC-SHA256 signing key, at least 32 characters. On the host set JWT_SECRET to a long random value.
    # The default is for local development only; the service logs a warning when it is used.
    secret: ${JWT_SECRET:local-development-only-secret-do-not-deploy-0000}
    # How long a sign-in lasts. The contract says 8 hours.
    time-to-live: ${JWT_TTL:8h}
  holds:
    # How long an approved reservation holds its units before they return to stock, by request urgency.
    # PROVISIONAL starting position for the design problem (ADR-002): the team decides and records the final values.
    routine: ${HOLD_ROUTINE:4h}
    urgent: ${HOLD_URGENT:2h}
    emergency: ${HOLD_EMERGENCY:1h}
  cors:
    # Comma-separated. On the host: ALLOWED_ORIGINS=https://<your-site>.netlify.app
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  pattern:
    # Adds the request id to every log line, e.g. "INFO [swagger-1f2e...]". Locally this stays readable text.
    # On the host set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for one JSON object per line (request id included).
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    # Publishes the info.* values below at /actuator/info.
    env:
      enabled: true

# GET /actuator/info: which commit is running. Render sets RENDER_GIT_COMMIT for every deploy; the pipeline waits until the
# live service reports the commit it just deployed, so the checks after a deploy test the new version, not the old one.
info:
  commit: ${RENDER_GIT_COMMIT:local}
