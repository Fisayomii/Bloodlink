openapi: 3.0.3
info:
  title: BloodLink API
  version: 0.2.5
  description: |
    Contract between the BloodLink interface and service (Team 4, TeSA cohort 6).
    This file is the agreement: the service does not implement a path that is not here,
    and the interface does not call one. Every change is logged in docs/decisions.md.

    **Scope:** v0.1 the Monday journey (record units, search availability, request, approve or decline).
    v0.2 adds issue and its reversal, cancellation by the hospital, releasing a routine hold for an emergency
    (ADR-002), a unit's history, donation slots and bookings, and the dashboard.

    **Conventions**
    - Every operation states `x-safety`: `safe` (no change), `idempotent` (repeating has the same effect)
      or `neither`.
    - Every response carries `X-Request-Id`. The interface sends one per user action; the service
      generates one if it is missing and echoes it back. It appears in every log line.
    - Every failure returns the `Error` shape with a stable `code` the interface can switch on.
    - Times are ISO 8601 with offset (UTC from the service). Dates are `YYYY-MM-DD`, sent as strings. Every date or
      time a client sends falls between 2000-01-01 and 2100-12-31; outside that, a body field gets 422 and a query
      value 400.
    - Matching is by the exact blood group, rhesus type and component entered. The service never
      substitutes one group for another.
    - All data is fictional. Requests never carry a patient name.
    - **Retrying a change of state** (approval, declination, issue, reversal, cancellation, hold release): a repeat
      never applies twice. Each checks the request's current state inside its transaction, so a second call changes
      nothing and answers 409 with the code for the state the request is now in. After a timeout or a dropped
      connection, the interface reads the request (`GET /requests/{requestId}`) before deciding what to show, and does
      not resend blindly. Operations that **create** something take an `Idempotency-Key` instead (`POST /requests`,
      `POST /donation-slots`).
  contact:
    name: Team 4
servers:
  - url: http://localhost:4010
    description: Prism mock (npm run mock)
  - url: http://localhost:8080
    description: Local service
tags:
  - name: Sessions
  - name: Organisations
  - name: Units
  - name: Availability
  - name: Requests
  - name: Donations
  - name: Dashboard
  - name: Operations
security:
  - bearerAuth: []

paths:
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Sign in with a demonstration account and receive an access token
      description: Creates a session (an access token). Demonstration accounts only; no real identity checks.
      x-safety: neither
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              email: staff@lagos-central.bank.demo
              password: Demo-Password-1
      responses:
        '201':
          description: Signed in
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /organisations:
    get:
      tags: [Organisations]
      operationId: listOrganisations
      summary: List blood banks and hospitals (for filters and display names)
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: type
          in: query
          required: false
          description: Filter by organisation type.
          schema:
            $ref: '#/components/schemas/OrganisationType'
        - name: area
          in: query
          required: false
          description: Filter by area name, exact match, case-insensitive.
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Organisations, ordered by name
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /units:
    get:
      tags: [Units]
      operationId: listUnits
      summary: List units held by a bank
      description: |
        Bank staff see only their own bank's units; `bankId` is ignored for them.
        The administrator sees all banks and may filter by `bankId`. Hospital staff and donors receive 403.
        `state` is computed at read time: a unit past its expiry date is reported `EXPIRED`
        even if the background job has not yet run.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BankIdQuery'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UnitState'
        - $ref: '#/components/parameters/BloodGroupQuery'
        - $ref: '#/components/parameters/RhesusQuery'
        - $ref: '#/components/parameters/ComponentQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of units, ordered by expiry date (soonest first), then reference
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Units]
      operationId: recordUnit
      summary: Record one received unit at the signed-in staff member's bank
      description: |
        Bank staff only. The bank is taken from the token, never from the body.
        Not safe to repeat blindly; a repeated `reference` at the same bank is refused with 409,
        so a retry after a lost response is detected rather than duplicated.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreate'
            example:
              reference: LCB-2026-00042
              bloodGroup: O
              rhesus: NEGATIVE
              component: RED_CELLS
              collectionDate: '2026-10-20'
              expiryDate: '2026-11-30'
      responses:
        '201':
          description: Unit recorded as AVAILABLE
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Location:
              description: Address of the new unit.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`DUPLICATE_UNIT_REFERENCE`: this bank already holds a unit with that reference.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DUPLICATE_UNIT_REFERENCE
                message: This bank already has a unit with reference LCB-2026-00042.
                requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
                details: []
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /availability:
    get:
      tags: [Availability]
      operationId: searchAvailability
      summary: Count available units by bank, group, rhesus type and component
      description: |
        Any signed-in user. Filters combine (AND); omitted filters match everything.
        A unit counts as available only if its state is AVAILABLE, its expiry date is today or later,
        and no reservation on it has an unexpired hold. A lapsed hold is never counted as held,
        whether or not the background job has run. Figures are derived from the records at the
        moment of the request and labelled with `computedAt`.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BloodGroupQuery'
        - $ref: '#/components/parameters/RhesusQuery'
        - $ref: '#/components/parameters/ComponentQuery'
        - $ref: '#/components/parameters/BankIdQuery'
        - name: area
          in: query
          required: false
          description: Area of the bank, exact match, case-insensitive.
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Availability rows; empty `items` when nothing matches
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: List blood requests visible to the caller
      description: |
        Hospital staff see their own hospital's requests. Bank staff see requests addressed to their bank.
        The administrator sees all. Donors receive 403.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequestState'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of requests, newest first
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Requests]
      operationId: createRequest
      summary: Request units of one group and component from one bank
      description: |
        Hospital staff only. The hospital is taken from the token.

        **Safe to submit twice.** The client sends an `Idempotency-Key` (a UUID) that it creates once per
        form submission and reuses on every retry of that submission, including after a timeout or a
        dropped connection. It creates a new key only after a success, or when the user changes the form.
        - First time a key is seen: 201, request created.
        - Same key, same body: 200 with the request already created, and `Idempotent-Replayed: true`.
          No second request is recorded.
        - Same key, different body: 422 `IDEMPOTENCY_KEY_REUSED`.

        Creating a request reserves nothing. Units are reserved only when the bank approves.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID, one per form submission, reused on retries.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequestCreate'
            example:
              bankId: 0d1f6a3e-2b4c-4e5f-8a9b-1c2d3e4f5a6b
              bloodGroup: O
              rhesus: NEGATIVE
              component: RED_CELLS
              quantity: 1
              urgency: EMERGENCY
              neededBy: '2026-10-26T14:00:00Z'
      responses:
        '201':
          description: Request created in state PENDING
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Location:
              description: Address of the new request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '200':
          description: Replay of an earlier submission with the same key and body; nothing new recorded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              description: Always `true` on a replay.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      tags: [Requests]
      operationId: getRequest
      summary: One request with its reservations and history
      description: |
        Visible to the requesting hospital, the addressed bank and the administrator; others receive 404
        (not 403) so the existence of other hospitals' requests is not revealed.
        Reservation `status` is computed at read time: a hold past `holdExpiresAt` is reported `LAPSED`
        even if the background job has not run. Reading never changes stored data.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/approval:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: approveRequest
      summary: Approve a pending request, reserving specific units
      description: |
        Staff of the addressed bank, or the administrator. In one database transaction the service picks
        `quantity` matching units (exact group, rhesus, component; AVAILABLE; not expired; soonest expiry
        first), marks them RESERVED and creates one reservation per unit with a hold expiry.
        All or nothing: if fewer matching units are free than requested, nothing is reserved.

        When several approvals race for the same last unit, exactly one succeeds. The others receive
        409 `UNITS_NO_LONGER_AVAILABLE` and the request stays PENDING, so the bank can decline it
        or retry later. A unit can never be held by two reservations at once; the database enforces this.

        **The hold** (ADR-002) starts at this approval and lasts by urgency: EMERGENCY 1 hour, URGENT 2 hours,
        ROUTINE 4 hours. Each reservation's `holdExpiresAt` is approval time plus that length; show it as
        "hold ends at". When it passes before the units are issued, the reservation reads `LAPSED` and the units count
        as available again at once, even before any background job runs; the request reads `LAPSED`, which is final
        (approval needs a PENDING request), so the hospital makes a new request.

        Not idempotent: approving an already approved request returns 409 `REQUEST_NOT_PENDING`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: Approved; the request now lists its reservations and their hold expiry
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `UNITS_NO_LONGER_AVAILABLE`: not enough matching units are free (for example another hospital's
            request took the last one a moment ago). `REQUEST_NOT_PENDING`: the request was already approved,
            declined or cancelled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNITS_NO_LONGER_AVAILABLE
                message: Only 0 of 1 matching units are free now. Nothing was reserved; the request is still pending.
                requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
                details: []
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/declination:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: declineRequest
      summary: Decline a pending request with a reason
      description: |
        Staff of the addressed bank, or the administrator. Records the decision (a thing) rather than
        calling an action. Not idempotent: a second decline returns 409 `REQUEST_NOT_PENDING`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Declination'
            example:
              reason: No O-negative red cells in stock until Thursday.
      responses:
        '201':
          description: Declined; the request shows the reason
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_NOT_PENDING`: the request was already approved, declined or cancelled.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /units/{unitId}:
    parameters:
      - $ref: '#/components/parameters/UnitIdPath'
    get:
      tags: [Units]
      operationId: getUnit
      summary: One unit with its full history
      description: |
        Staff of the bank that holds the unit, or the administrator. Staff of another bank receive 404, so the
        existence of other banks' units is not revealed. Hospital staff and donors receive 403.
        `state` is computed at read time, like the list. The history is oldest first and never edited: an issue
        and its reversal both stay visible.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The unit and its history
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/issue:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: issueRequest
      summary: Record the reserved units as issued (handed to the hospital)
      description: |
        Staff of the addressed bank, or the administrator. Allowed only while the request is APPROVED: every hold
        still running and no reserved unit past its expiry date. In one transaction every reserved unit becomes
        ISSUED, every reservation ISSUED, and the request FULFILLED. All or nothing.

        An expired unit can never be issued. A request whose hold has lapsed, or whose unit expired while
        reserved, is no longer APPROVED, so the call is refused with 409 `REQUEST_NOT_APPROVED`.

        Not idempotent: issuing a request that is already FULFILLED returns 409 `REQUEST_NOT_APPROVED`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: Issued; the request is FULFILLED and its history shows who issued and when
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_NOT_APPROVED`: the request is not APPROVED now (pending, already fulfilled, its hold lapsed, or a reserved unit expired).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REQUEST_NOT_APPROVED
                message: 'This request cannot be issued: its hold has lapsed. The hospital can make a new request.'
                requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
                details: []
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/issue/reversal:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: reverseIssue
      summary: Reverse an issue that was recorded in error
      description: |
        Staff of the addressed bank, or the administrator. Allowed only when the request is FULFILLED.
        In one transaction:
        - each issued unit returns to AVAILABLE **only if it has not expired**; a unit past its expiry date
          becomes EXPIRED instead;
        - each reservation becomes REVERSED;
        - the request goes back to PENDING, so it is not lost and the bank can approve it again.

        Nothing is deleted: the unit's and the request's history keep both the ISSUED entry and the
        ISSUE_REVERSED entry, with the reason. Not idempotent: a second reversal returns 409.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueReversal'
            example:
              reason: Issued to the wrong request; the units never left the bank.
      responses:
        '201':
          description: Reversed; the request is PENDING again and its history shows both entries
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_NOT_FULFILLED`: there is no issue to reverse (the request is not FULFILLED).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: cancelRequest
      summary: The requesting hospital withdraws its own request
      description: |
        **Only staff of the hospital that made the request.** Other hospitals receive 404; bank staff, donors and
        the administrator receive 403. Allowed while the request is PENDING or APPROVED. Cancelling an APPROVED
        request releases its holds in the same transaction: each reservation becomes RELEASED and each unit
        returns to AVAILABLE, or becomes EXPIRED if it is past its expiry date (an expired unit never returns to
        stock). The request becomes CANCELLED. A second cancellation changes nothing and returns 409 `REQUEST_CLOSED`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancellation'
            example:
              reason: Patient transferred to another hospital.
      responses:
        '201':
          description: Cancelled; any held units are back in stock
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_CLOSED`: the request is already fulfilled, declined, cancelled, lapsed or ended by an expired unit.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/hold-release:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: releaseHoldForEmergency
      summary: Release a routine request's hold so an emergency request can have its units (ADR-002)
      description: |
        Staff of the bank holding the units, or the administrator. `requestId` is the **routine** request whose
        hold is released; `forRequestId` is the **emergency** request that receives the units. Never automatic:
        it is a recorded decision with a reason.

        Rules, all checked in one transaction:
        - the released request is APPROVED with urgency ROUTINE, at this bank;
        - the receiving request is PENDING with urgency EMERGENCY, at the same bank, for the same group,
          rhesus type and component;
        - free matching units could not already meet the emergency (otherwise approve it directly; a promise to
          the routine hospital is never broken without need);
        - the emergency request is then approved exactly as `POST /requests/{id}/approval` would. If it still cannot
          be met in full, nothing is released (all or nothing).

        The released units return to AVAILABLE before the emergency is approved, or become EXPIRED if past their
        expiry date (an expired unit never returns to stock). The routine request goes back to PENDING with a
        HOLD_RELEASED history entry naming the emergency request and the reason, so it is never silently lost.
        The response is the emergency request, now APPROVED.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRelease'
            example:
              forRequestId: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
              reason: Emergency at Ikorodu; Yaba confirmed by phone that its courier has not left.
      responses:
        '201':
          description: Released; the emergency request is APPROVED and holds the units
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `HOLD_NOT_RELEASABLE`: the released request is not an APPROVED routine request, the two requests do not
            match (bank, group, rhesus, component, or the receiver is not an emergency), or free units could already
            meet the emergency.
            `REQUEST_NOT_PENDING`: the emergency request is no longer pending.
            `UNITS_NO_LONGER_AVAILABLE`: even with the released units the emergency cannot be met; nothing changed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /donation-slots:
    get:
      tags: [Donations]
      operationId: listDonationSlots
      summary: Donation slots at blood banks, with places left
      description: |
        Any signed-in user. Defaults to the next 14 days (Lagos dates). `placesLeft` is derived from the bookings
        at the moment of the request and labelled with `computedAt`.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BankIdQuery'
        - name: from
          in: query
          required: false
          description: First day to include. Default today. Dates from 2000 to 2100.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day to include. Default 14 days after `from`. At most 31 days after `from`, and not after 2100.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Slots ordered by start time; empty `items` when none match
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationSlotList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Donations]
      operationId: createDonationSlot
      summary: Open a donation slot at the signed-in staff member's bank
      description: |
        Bank staff only. The bank comes from the token.

        **Safe to submit twice**, the same way as `POST /requests`: the client sends an `Idempotency-Key` (a UUID)
        created once per form submission and reused on every retry of it.
        - First time a key is seen: 201, slot opened.
        - Same key, same body: 200 with the slot already opened, and `Idempotent-Replayed: true`. No second slot.
        - Same key, different body: 422 `IDEMPOTENCY_KEY_REUSED`.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID, one per form submission, reused on retries.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationSlotCreate'
            example:
              startsAt: '2026-10-29T09:00:00+01:00'
              endsAt: '2026-10-29T10:00:00+01:00'
              capacity: 4
      responses:
        '201':
          description: Slot opened
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationSlot'
        '200':
          description: Replay of an earlier submission with the same key and body; nothing new opened
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              description: Always `true` on a replay.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /donation-slots/{slotId}/bookings:
    parameters:
      - $ref: '#/components/parameters/SlotIdPath'
    post:
      tags: [Donations]
      operationId: bookDonationSlot
      summary: A donor books a place in a slot
      description: |
        Donors only; the donor comes from the token. A slot never has more active bookings (BOOKED or ATTENDED)
        than its capacity, **including when two donors book the last place in the same second**: the database
        enforces it, one booking succeeds and the other receives 409 `SLOT_FULL`.
        One active booking per donor per slot: booking the same slot again returns 409 `ALREADY_BOOKED`, so a
        double tap records one booking. Slots that have started cannot be booked (409 `SLOT_CLOSED`).
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: Booked
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`SLOT_FULL`, `ALREADY_BOOKED` or `SLOT_CLOSED`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SLOT_FULL
                message: This slot has no places left. Please choose another time.
                requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
                details: []
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings:
    get:
      tags: [Donations]
      operationId: listBookings
      summary: Donation bookings visible to the caller
      description: |
        Donors see their own bookings. Bank staff see bookings for their bank's slots. The administrator sees all.
        Hospital staff receive 403.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of bookings, soonest slot first
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{bookingId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/BookingIdPath'
    post:
      tags: [Donations]
      operationId: cancelBooking
      summary: A donor cancels their own booking, freeing the place
      description: |
        Only the donor who made the booking; anyone else receives 404. Allowed while the booking is BOOKED and
        the slot has not started. Not idempotent: a second cancellation returns 409 `BOOKING_NOT_ACTIVE`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: Cancelled; the place is free again
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`BOOKING_NOT_ACTIVE` (already cancelled or recorded) or `SLOT_CLOSED` (the slot has started).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{bookingId}/attendance:
    parameters:
      - $ref: '#/components/parameters/BookingIdPath'
    post:
      tags: [Donations]
      operationId: recordAttendance
      summary: Bank staff record that the donor attended or did not show
      description: |
        Staff of the bank that runs the slot, or the administrator; staff of another bank receive 404.
        Allowed once the slot has started, and only for a BOOKED booking. Not idempotent: recording a second
        outcome returns 409 `BOOKING_NOT_ACTIVE`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attendance'
            example:
              outcome: ATTENDED
      responses:
        '201':
          description: Recorded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`BOOKING_NOT_ACTIVE` (not BOOKED) or `SLOT_NOT_STARTED` (too early to record).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Stock and activity summary for a bank, derived from the records
      description: |
        Bank staff see their own bank; `bankId` is ignored for them. The administrator sees every bank, or one
        bank with `bankId`. Hospital staff and donors receive 403.
        Every figure is computed from the records at the moment of the request (nothing is stored) and the
        response carries `computedAt`. The windows used are stated in the response so the screen can label them.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BankIdQuery'
      responses:
        '200':
          description: The dashboard
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /actuator/info:
    get:
      tags: [Operations]
      operationId: getInfo
      summary: Which version of the service is running
      description: |
        The git commit the running service was built from (`local` when not deployed). The pipeline polls this after a
        deploy, so the checks that follow run against the new version rather than the one it replaced.
      x-safety: safe
      security: []
      # The service answers with Spring's actuator media type unless the caller asks for application/json; the body is
      # the same JSON either way.
      responses:
        '200':
          description: The running version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
              example:
                commit: 3de28e9a1b2c4d5e6f708192a3b4c5d6e7f80912
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Info'

  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness and database reachability, for the host and for waking the service before a demo
      x-safety: safe
      security: []
      # The service answers with Spring's actuator media type unless the caller asks for application/json; the body is
      # the same JSON either way.
      responses:
        '200':
          description: Service and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service is up but a dependency (the database) is not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /sessions. Carries the user's role and organisation.

  headers:
    X-Request-Id:
      description: The request identifier sent by the interface, or one generated by the service. Appears in every log line.
      schema:
        type: string
        maxLength: 64
        example: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55

  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: One identifier per user action (a UUID is recommended). Echoed back and logged.
      schema:
        type: string
        maxLength: 64
    RequestIdPath:
      name: requestId
      in: path
      required: true
      description: Identifier of the blood request (not the X-Request-Id header).
      schema:
        type: string
        format: uuid
    UnitIdPath:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlotIdPath:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingIdPath:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BankIdQuery:
      name: bankId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BloodGroupQuery:
      name: bloodGroup
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BloodGroup'
    RhesusQuery:
      name: rhesus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Rhesus'
    ComponentQuery:
      name: component
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Component'
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: '`MALFORMED_REQUEST`: unreadable JSON, wrong type, or an invalid query or path value.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: MALFORMED_REQUEST
            message: The body could not be read as JSON.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    Unauthenticated:
      description: '`UNAUTHENTICATED`: no token, or an expired or invalid token. The interface returns to sign-in.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    InvalidCredentials:
      description: '`INVALID_CREDENTIALS`: email or password is wrong. The message does not say which.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_CREDENTIALS
            message: Email or password is incorrect.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    Forbidden:
      description: '`FORBIDDEN`: signed in, but this role or organisation may not do this.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Only staff of the bank that holds this unit can change it.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    NotFound:
      description: '`NOT_FOUND`: no such resource, or it is not visible to the caller.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Request not found.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    ValidationFailed:
      description: |
        `VALIDATION_FAILED`: well-formed but breaks a rule; `details` names each field.
        `IDEMPOTENCY_KEY_REUSED`: the key was already used with a different body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: Some fields need attention.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details:
              - field: expiryDate
                issue: Must be after collectionDate.
    InternalError:
      description: '`INTERNAL_ERROR`: unexpected failure. Safe to retry reads; quote the requestId when reporting.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Something went wrong on our side. Please try again.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          description: Stable machine-readable code. The interface switches on this, never on `message`.
          enum:
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - DUPLICATE_UNIT_REFERENCE
            - UNITS_NO_LONGER_AVAILABLE
            - REQUEST_NOT_PENDING
            - REQUEST_NOT_APPROVED
            - REQUEST_NOT_FULFILLED
            - REQUEST_CLOSED
            - HOLD_NOT_RELEASABLE
            - SLOT_FULL
            - SLOT_CLOSED
            - SLOT_NOT_STARTED
            - ALREADY_BOOKED
            - BOOKING_NOT_ACTIVE
            - INTERNAL_ERROR
        message:
          type: string
          description: Plain-language sentence safe to show to the user.
          maxLength: 300
        requestId:
          type: string
          description: Same value as the X-Request-Id response header.
          maxLength: 64
        details:
          type: array
          description: Field-level problems. Empty when not applicable.
          items:
            $ref: '#/components/schemas/FieldIssue'

    FieldIssue:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
          description: Name of the body field or parameter.
        issue:
          type: string
          description: What is wrong, in plain language.

    Role:
      type: string
      enum: [BANK_STAFF, HOSPITAL_STAFF, DONOR, ADMIN]

    OrganisationType:
      type: string
      enum: [BLOOD_BANK, HOSPITAL]

    BloodGroup:
      type: string
      description: ABO group. With `rhesus` this gives the eight groups.
      enum: [A, B, AB, O]

    Rhesus:
      type: string
      enum: [POSITIVE, NEGATIVE]

    Component:
      type: string
      enum: [WHOLE_BLOOD, RED_CELLS, PLATELETS, PLASMA, CRYOPRECIPITATE]

    Urgency:
      type: string
      enum: [ROUTINE, URGENT, EMERGENCY]

    UnitState:
      type: string
      description: A unit has exactly one state at a time.
      enum: [AVAILABLE, RESERVED, ISSUED, EXPIRED, DISCARDED]

    RequestState:
      type: string
      description: |
        PENDING: waiting for the bank. APPROVED: units reserved and on hold. DECLINED: refused with a reason.
        CANCELLED: withdrawn by the hospital. FULFILLED: all reserved units issued.
        LAPSED: the hold passed before issue; units returned to stock. A reversed issue, or a routine hold
        released for an emergency, puts the request back to PENDING.
        UNIT_EXPIRED: a reserved unit passed its expiry date before issue.
        LAPSED and UNIT_EXPIRED are final, like DECLINED and CANCELLED: approval needs a PENDING request, so the
        hospital makes a new request.
      enum: [PENDING, APPROVED, DECLINED, CANCELLED, FULFILLED, LAPSED, UNIT_EXPIRED]

    ReservationStatus:
      type: string
      description: |
        ACTIVE means the hold has not passed. LAPSED is reported as soon as `holdExpiresAt` passes.
        ISSUED: the unit was handed over. REVERSED: that issue was reversed. RELEASED: the hold was ended early
        (the hospital cancelled, or bank staff released it for an emergency). UNIT_EXPIRED: the unit expired while held.
      enum: [ACTIVE, LAPSED, ISSUED, REVERSED, UNIT_EXPIRED, RELEASED]

