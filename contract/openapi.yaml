openapi: 3.0.3
info:
  title: BloodLink API
  version: 0.1.0
  description: |
    Contract between the BloodLink interface and service (Team 4, TeSA cohort 6).
    This file is the agreement: the service does not implement a path that is not here,
    and the interface does not call one. Every change is logged in docs/decisions.md.

    **Scope of v0:** the Monday journey (record units, search availability, request, approve or decline).

    **Conventions**
    - Every operation states `x-safety`: `safe` (no change), `idempotent` (repeating has the same effect)
      or `neither`.
    - Every response carries `X-Request-Id`. The interface sends one per user action; the service
      generates one if it is missing and echoes it back. It appears in every log line.
    - Every failure returns the `Error` shape with a stable `code` the interface can switch on.
    - Times are ISO 8601 with offset (UTC from the service). Dates are `YYYY-MM-DD`.
    - Matching is by the exact blood group, rhesus type and component entered. The service never
      substitutes one group for another.
    - All data is fictional. Requests never carry a patient name.
  contact:
    name: Team 4
servers:
  - url: http://localhost:4010
    description: Prism mock (npm run mock)
  - url: http://localhost:8080
    description: Local service
tags:
  - name: Sessions
  - name: Organisations
  - name: Units
  - name: Availability
  - name: Requests
  - name: Operations
security:
  - bearerAuth: []

paths:
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Sign in with a demonstration account and receive an access token
      description: Creates a session (an access token). Demonstration accounts only; no real identity checks.
      x-safety: neither
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              email: staff@lagos-central.bank.demo
              password: Demo-Password-1
      responses:
        '201':
          description: Signed in
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /organisations:
    get:
      tags: [Organisations]
      operationId: listOrganisations
      summary: List blood banks and hospitals (for filters and display names)
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: type
          in: query
          required: false
          description: Filter by organisation type.
          schema:
            $ref: '#/components/schemas/OrganisationType'
        - name: area
          in: query
          required: false
          description: Filter by area name, exact match, case-insensitive.
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Organisations, ordered by name
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /units:
    get:
      tags: [Units]
      operationId: listUnits
      summary: List units held by a bank
      description: |
        Bank staff see only their own bank's units; `bankId` is ignored for them.
        The administrator sees all banks and may filter by `bankId`. Hospital staff and donors receive 403.
        `state` is computed at read time: a unit past its expiry date is reported `EXPIRED`
        even if the background job has not yet run.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BankIdQuery'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UnitState'
        - $ref: '#/components/parameters/BloodGroupQuery'
        - $ref: '#/components/parameters/RhesusQuery'
        - $ref: '#/components/parameters/ComponentQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of units, ordered by expiry date (soonest first), then reference
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Units]
      operationId: recordUnit
      summary: Record one received unit at the signed-in staff member's bank
      description: |
        Bank staff only. The bank is taken from the token, never from the body.
        Not safe to repeat blindly; a repeated `reference` at the same bank is refused with 409,
        so a retry after a lost response is detected rather than duplicated.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreate'
            example:
              reference: LCB-2026-00042
              bloodGroup: O
              rhesus: NEGATIVE
              component: RED_CELLS
              collectionDate: '2026-10-20'
              expiryDate: '2026-11-30'
      responses:
        '201':
          description: Unit recorded as AVAILABLE
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Location:
              description: Address of the new unit.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`DUPLICATE_UNIT_REFERENCE`: this bank already holds a unit with that reference.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DUPLICATE_UNIT_REFERENCE
                message: This bank already has a unit with reference LCB-2026-00042.
                requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
                details: []
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /availability:
    get:
      tags: [Availability]
      operationId: searchAvailability
      summary: Count available units by bank, group, rhesus type and component
      description: |
        Any signed-in user. Filters combine (AND); omitted filters match everything.
        A unit counts as available only if its state is AVAILABLE, its expiry date is today or later,
        and no reservation on it has an unexpired hold. A lapsed hold is never counted as held,
        whether or not the background job has run. Figures are derived from the records at the
        moment of the request and labelled with `computedAt`.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BloodGroupQuery'
        - $ref: '#/components/parameters/RhesusQuery'
        - $ref: '#/components/parameters/ComponentQuery'
        - $ref: '#/components/parameters/BankIdQuery'
        - name: area
          in: query
          required: false
          description: Area of the bank, exact match, case-insensitive.
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Availability rows; empty `items` when nothing matches
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: List blood requests visible to the caller
      description: |
        Hospital staff see their own hospital's requests. Bank staff see requests addressed to their bank.
        The administrator sees all. Donors receive 403.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequestState'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of requests, newest first
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Requests]
      operationId: createRequest
      summary: Request units of one group and component from one bank
      description: |
        Hospital staff only. The hospital is taken from the token.

        **Safe to submit twice.** The client sends an `Idempotency-Key` (a UUID) that it creates once per
        form submission and reuses on every retry of that submission, including after a timeout or a
        dropped connection. It creates a new key only after a success, or when the user changes the form.
        - First time a key is seen: 201, request created.
        - Same key, same body: 200 with the request already created, and `Idempotent-Replayed: true`.
          No second request is recorded.
        - Same key, different body: 422 `IDEMPOTENCY_KEY_REUSED`.

        Creating a request reserves nothing. Units are reserved only when the bank approves.
      x-safety: idempotent
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID, one per form submission, reused on retries.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequestCreate'
            example:
              bankId: 0d1f6a3e-2b4c-4e5f-8a9b-1c2d3e4f5a6b
              bloodGroup: O
              rhesus: NEGATIVE
              component: RED_CELLS
              quantity: 1
              urgency: EMERGENCY
              neededBy: '2026-10-26T14:00:00Z'
      responses:
        '201':
          description: Request created in state PENDING
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Location:
              description: Address of the new request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '200':
          description: Replay of an earlier submission with the same key and body; nothing new recorded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotent-Replayed:
              description: Always `true` on a replay.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      tags: [Requests]
      operationId: getRequest
      summary: One request with its reservations and history
      description: |
        Visible to the requesting hospital, the addressed bank and the administrator; others receive 404
        (not 403) so the existence of other hospitals' requests is not revealed.
        Reservation `status` is computed at read time: a hold past `holdExpiresAt` is reported `LAPSED`
        even if the background job has not run. Reading never changes stored data.
      x-safety: safe
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/approval:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: approveRequest
      summary: Approve a pending request, reserving specific units
      description: |
        Staff of the addressed bank, or the administrator. In one database transaction the service picks
        `quantity` matching units (exact group, rhesus, component; AVAILABLE; not expired; soonest expiry
        first), marks them RESERVED and creates one reservation per unit with a hold expiry.
        All or nothing: if fewer matching units are free than requested, nothing is reserved.

        When several approvals race for the same last unit, exactly one succeeds. The others receive
        409 `UNITS_NO_LONGER_AVAILABLE` and the request stays PENDING, so the bank can decline it
        or retry later. A unit can never be held by two reservations at once; the database enforces this.

        Not idempotent: approving an already approved request returns 409 `REQUEST_NOT_PENDING`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '201':
          description: Approved; the request now lists its reservations and their hold expiry
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `UNITS_NO_LONGER_AVAILABLE`: not enough matching units are free (for example another hospital's
            request took the last one a moment ago). `REQUEST_NOT_PENDING`: the request was already approved,
            declined or cancelled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNITS_NO_LONGER_AVAILABLE
                message: Only 0 of 1 matching units are free now. Nothing was reserved; the request is still pending.
                requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
                details: []
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{requestId}/declination:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    post:
      tags: [Requests]
      operationId: declineRequest
      summary: Decline a pending request with a reason
      description: |
        Staff of the addressed bank, or the administrator. Records the decision (a thing) rather than
        calling an action. Not idempotent: a second decline returns 409 `REQUEST_NOT_PENDING`.
      x-safety: neither
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Declination'
            example:
              reason: No O-negative red cells in stock until Thursday.
      responses:
        '201':
          description: Declined; the request shows the reason
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_NOT_PENDING`: the request was already approved, declined or cancelled.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness and database reachability, for the host and for waking the service before a demo
      x-safety: safe
      security: []
      responses:
        '200':
          description: Service and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: Service is up but a dependency (the database) is not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /sessions. Carries the user's role and organisation.

  headers:
    X-Request-Id:
      description: The request identifier sent by the interface, or one generated by the service. Appears in every log line.
      schema:
        type: string
        maxLength: 64
        example: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55

  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: One identifier per user action (a UUID is recommended). Echoed back and logged.
      schema:
        type: string
        maxLength: 64
    RequestIdPath:
      name: requestId
      in: path
      required: true
      description: Identifier of the blood request (not the X-Request-Id header).
      schema:
        type: string
        format: uuid
    BankIdQuery:
      name: bankId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BloodGroupQuery:
      name: bloodGroup
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BloodGroup'
    RhesusQuery:
      name: rhesus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Rhesus'
    ComponentQuery:
      name: component
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Component'
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: '`MALFORMED_REQUEST`: unreadable JSON, wrong type, or an invalid query or path value.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: MALFORMED_REQUEST
            message: The body could not be read as JSON.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    Unauthenticated:
      description: '`UNAUTHENTICATED`: no token, or an expired or invalid token. The interface returns to sign-in.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: Sign in to continue.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    InvalidCredentials:
      description: '`INVALID_CREDENTIALS`: email or password is wrong. The message does not say which.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_CREDENTIALS
            message: Email or password is incorrect.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    Forbidden:
      description: '`FORBIDDEN`: signed in, but this role or organisation may not do this.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Only staff of the bank that holds this unit can change it.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    NotFound:
      description: '`NOT_FOUND`: no such resource, or it is not visible to the caller.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Request not found.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []
    ValidationFailed:
      description: |
        `VALIDATION_FAILED`: well-formed but breaks a rule; `details` names each field.
        `IDEMPOTENCY_KEY_REUSED`: the key was already used with a different body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: Some fields need attention.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details:
              - field: expiryDate
                issue: Must be after collectionDate.
    InternalError:
      description: '`INTERNAL_ERROR`: unexpected failure. Safe to retry reads; quote the requestId when reporting.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Something went wrong on our side. Please try again.
            requestId: 7f9c2b1e-4c1a-4f7e-9d0b-2a6c8e1f3b55
            details: []

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          description: Stable machine-readable code. The interface switches on this, never on `message`.
          enum:
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - DUPLICATE_UNIT_REFERENCE
            - UNITS_NO_LONGER_AVAILABLE
            - REQUEST_NOT_PENDING
            - INTERNAL_ERROR
        message:
          type: string
          description: Plain-language sentence safe to show to the user.
          maxLength: 300
        requestId:
          type: string
          description: Same value as the X-Request-Id response header.
          maxLength: 64
        details:
          type: array
          description: Field-level problems. Empty when not applicable.
          items:
            $ref: '#/components/schemas/FieldIssue'

    FieldIssue:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
          description: Name of the body field or parameter.
        issue:
          type: string
          description: What is wrong, in plain language.

    Role:
      type: string
      enum: [BANK_STAFF, HOSPITAL_STAFF, DONOR, ADMIN]

    OrganisationType:
      type: string
      enum: [BLOOD_BANK, HOSPITAL]

    BloodGroup:
      type: string
      description: ABO group. With `rhesus` this gives the eight groups.
      enum: [A, B, AB, O]

    Rhesus:
      type: string
      enum: [POSITIVE, NEGATIVE]

    Component:
      type: string
      enum: [WHOLE_BLOOD, RED_CELLS, PLATELETS, PLASMA, CRYOPRECIPITATE]

    Urgency:
      type: string
      enum: [ROUTINE, URGENT, EMERGENCY]

    UnitState:
      type: string
      description: A unit has exactly one state at a time.
      enum: [AVAILABLE, RESERVED, ISSUED, EXPIRED, DISCARDED]

    RequestState:
      type: string
      description: |
        PENDING: waiting for the bank. APPROVED: units reserved and on hold. DECLINED: refused with a reason.
        CANCELLED: withdrawn by the hospital. FULFILLED: all reserved units issued.
        LAPSED: the hold passed before issue; units returned to stock.
        UNIT_EXPIRED: a reserved unit passed its expiry date before issue.
      enum: [PENDING, APPROVED, DECLINED, CANCELLED, FULFILLED, LAPSED, UNIT_EXPIRED]

    ReservationStatus:
      type: string
      description: ACTIVE means the hold has not passed. LAPSED is reported as soon as `holdExpiresAt` passes.
      enum: [ACTIVE, LAPSED, ISSUED, UNIT_EXPIRED, RELEASED]

    SessionCreate:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    Session:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`.'
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working (8 hours after sign-in).
        user:
          $ref: '#/components/schemas/User'
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.demo.signature
        tokenType: Bearer
        expiresAt: '2026-10-26T18:00:00Z'
        user:
          id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          displayName: Adaeze Okafor
          email: staff@lagos-central.bank.demo
          role: BANK_STAFF
          organisation:
            id: 0d1f6a3e-2b4c-4e5f-8a9b-1c2d3e4f5a6b
            name: Lagos Central Blood Bank (demo)
            type: BLOOD_BANK
            area: Ikeja

    User:
      type: object
      additionalProperties: false
      required: [id, displayName, email, role, organisation]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        organisation:
          description: The bank or hospital the user works for. Null for donors and the administrator.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Organisation'

    Organisation:
      type: object
      additionalProperties: false
      required: [id, name, type, area]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        type:
          $ref: '#/components/schemas/OrganisationType'
        area:
          type: string
          description: Local government area or district, for searching.
          maxLength: 80

    UnitCreate:
      type: object
      additionalProperties: false
      required: [reference, bloodGroup, rhesus, component, collectionDate, expiryDate]
      properties:
        reference:
          type: string
          description: The bank's own label for this unit. Unique within the bank.
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9-]+$'
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        rhesus:
          $ref: '#/components/schemas/Rhesus'
        component:
          $ref: '#/components/schemas/Component'
        collectionDate:
          type: string
          format: date
          description: Not in the future.
        expiryDate:
          type: string
          format: date
          description: After collectionDate. The unit may be used up to and including this date.

    Unit:
      type: object
      additionalProperties: false
      required: [id, reference, bloodGroup, rhesus, component, collectionDate, expiryDate, state, bank, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        rhesus:
          $ref: '#/components/schemas/Rhesus'
        component:
          $ref: '#/components/schemas/Component'
        collectionDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        state:
          $ref: '#/components/schemas/UnitState'
        bank:
          $ref: '#/components/schemas/Organisation'
        recordedAt:
          type: string
          format: date-time
      example:
        id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
        reference: LCB-2026-00042
        bloodGroup: O
        rhesus: NEGATIVE
        component: RED_CELLS
        collectionDate: '2026-10-20'
        expiryDate: '2026-11-30'
        state: AVAILABLE
        bank:
          id: 0d1f6a3e-2b4c-4e5f-8a9b-1c2d3e4f5a6b
          name: Lagos Central Blood Bank (demo)
          type: BLOOD_BANK
          area: Ikeja
        recordedAt: '2026-10-23T09:15:00Z'

    UnitPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    Availability:
      type: object
      additionalProperties: false
      required: [items, computedAt, matching]
      properties:
        computedAt:
          type: string
          format: date-time
          description: When these figures were derived from the records. Show it beside the figures.
        matching:
          type: string
          description: Fixed statement for the screen about how matching works.
          enum: ['Exact group, rhesus type and component only. No substitution.']
        items:
          type: array
          description: One row per bank and group/rhesus/component combination with at least one available unit.
          items:
            $ref: '#/components/schemas/AvailabilityRow'
      example:
        computedAt: '2026-10-26T10:02:11Z'
        matching: Exact group, rhesus type and component only. No substitution.
        items:
          - bank:
              id: 0d1f6a3e-2b4c-4e5f-8a9b-1c2d3e4f5a6b
              name: Lagos Central Blood Bank (demo)
              type: BLOOD_BANK
              area: Ikeja
            bloodGroup: O
            rhesus: NEGATIVE
            component: RED_CELLS
            availableUnits: 1
            earliestExpiryDate: '2026-11-30'

    AvailabilityRow:
      type: object
      additionalProperties: false
      required: [bank, bloodGroup, rhesus, component, availableUnits, earliestExpiryDate]
      properties:
        bank:
          $ref: '#/components/schemas/Organisation'
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        rhesus:
          $ref: '#/components/schemas/Rhesus'
        component:
          $ref: '#/components/schemas/Component'
        availableUnits:
          type: integer
          format: int32
          minimum: 1
          description: Count of units (each unit is one bag).
        earliestExpiryDate:
          type: string
          format: date

    BloodRequestCreate:
      type: object
      additionalProperties: false
      description: No patient details of any kind. Unknown fields are refused.
      required: [bankId, bloodGroup, rhesus, component, quantity, urgency, neededBy]
      properties:
        bankId:
          type: string
          format: uuid
          description: The blood bank asked to supply the units.
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        rhesus:
          $ref: '#/components/schemas/Rhesus'
        component:
          $ref: '#/components/schemas/Component'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          description: Number of units.
        urgency:
          $ref: '#/components/schemas/Urgency'
        neededBy:
          type: string
          format: date-time
          description: Must be in the future.

    Declination:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    Reservation:
      type: object
      additionalProperties: false
      required: [id, unit, status, holdExpiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        unit:
          $ref: '#/components/schemas/UnitSummary'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        holdExpiresAt:
          type: string
          format: date-time
          description: The hold ends at this time. Show it as "hold ends at".
        createdAt:
          type: string
          format: date-time

    UnitSummary:
      type: object
      additionalProperties: false
      required: [id, reference, expiryDate]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        expiryDate:
          type: string
          format: date

    HistoryEntry:
      type: object
      additionalProperties: false
      required: [at, event, actor]
      properties:
        at:
          type: string
          format: date-time
        event:
          type: string
          description: What happened, for example CREATED, APPROVED, DECLINED, HOLD_LAPSED.
          maxLength: 40
        actor:
          type: string
          description: Display name and organisation of who did it, or "System" for the background job.
          maxLength: 200
        note:
          type: string
          nullable: true
          maxLength: 500

    BloodRequest:
      type: object
      additionalProperties: false
      required: [id, reference, hospital, bank, bloodGroup, rhesus, component, quantity, urgency, neededBy, state, createdAt, reservations, history]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: Human-readable reference, for example REQ-2026-000123. Never a patient name.
        hospital:
          $ref: '#/components/schemas/Organisation'
        bank:
          $ref: '#/components/schemas/Organisation'
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        rhesus:
          $ref: '#/components/schemas/Rhesus'
        component:
          $ref: '#/components/schemas/Component'
        quantity:
          type: integer
          format: int32
        urgency:
          $ref: '#/components/schemas/Urgency'
        neededBy:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/RequestState'
        declineReason:
          type: string
          nullable: true
          description: Set when state is DECLINED.
        createdAt:
          type: string
          format: date-time
        reservations:
          type: array
          description: Empty until approved.
          items:
            $ref: '#/components/schemas/Reservation'
        history:
          type: array
          description: Oldest first. Entries are never removed.
          items:
            $ref: '#/components/schemas/HistoryEntry'
      example:
        id: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
        reference: REQ-2026-000123
        hospital:
          id: 6e7f8a9b-0c1d-4e2f-9a3b-4c5d6e7f8a9b
          name: Yaba General Hospital (demo)
          type: HOSPITAL
          area: Yaba
        bank:
          id: 0d1f6a3e-2b4c-4e5f-8a9b-1c2d3e4f5a6b
          name: Lagos Central Blood Bank (demo)
          type: BLOOD_BANK
          area: Ikeja
        bloodGroup: O
        rhesus: NEGATIVE
        component: RED_CELLS
        quantity: 1
        urgency: EMERGENCY
        neededBy: '2026-10-26T14:00:00Z'
        state: APPROVED
        declineReason: null
        createdAt: '2026-10-26T10:05:00Z'
        reservations:
          - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            unit:
              id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
              reference: LCB-2026-00042
              expiryDate: '2026-11-30'
            status: ACTIVE
            holdExpiresAt: '2026-10-26T11:06:00Z'
            createdAt: '2026-10-26T10:06:00Z'
        history:
          - at: '2026-10-26T10:05:00Z'
            event: CREATED
            actor: Tunde Bello, Yaba General Hospital (demo)
            note: null
          - at: '2026-10-26T10:06:00Z'
            event: APPROVED
            actor: Adaeze Okafor, Lagos Central Blood Bank (demo)
            note: null

    BloodRequestPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BloodRequest'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
